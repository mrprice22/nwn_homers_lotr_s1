# This ~6min republish was pegging the 4-core APU at boot and starving the GUI
# autologin (gnome-shell 60s+, portals timed out -> greeter). Yield CPU/IO AND
# defer the heavy work ~2.5min so the desktop comes up first. Not boot-urgent.
[Service]
CPUWeight=5
IOWeight=5
Nice=19
ExecStartPre=/usr/bin/sleep 150
