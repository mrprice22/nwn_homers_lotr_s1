    notes: "<div>The internal backlog editor now has a <b>Palette Finder</b>: search a creature, item, or placeable by name or resref and it tells you exactly where to find it in the in-game toolset palette (the full Top &gt; Sub &gt; category path), so you no longer have to hunt through hundreds of palette folders. The map is rebuilt on demand from a button; it never runs as part of a rebuild or wiki publish.</div>"
    impl_notes: "<div><b>Summary.</b> Added a Palette Finder to the internal roadmap/merit editor: search any creature/item/placeable/etc. by name or resref and it reports the exact toolset-palette location (Top &gt; Sub &gt; category). Backed by bin/gen-palette-map.py (a standalone, on-demand script — never run by the wiki/rebuild) with a Refresh button in the editor. CLAUDE.md and CLAUDE-autopilot.md were updated so new blueprints are filed by PaletteID and manual-action steps include the palette category path.</div><div>Shipped across 88780c7d597 (Palette Finder: bin/gen-palette-map.py builds module-index/palette_map.json — resref → {name, type, palette path, in_palette, custom_palette} across all 9 palettes; editor gets a Palette Finder button, /api/palette search and /api/palette/refresh endpoints, results table with palette location + custom/standard flag) and 0aa18ad6d08 (place blueprints at their PaletteID home to match the toolset, with the custom/standard bucket flag). The map is standalone/on-demand only — explicitly NOT wired into the wiki build or any publish. CLAUDE.md documents the palette_map.json lookup + the file-palette-orphans.py / check_palette_coverage gate, and CLAUDE-autopilot.md step 3 requires filing new blueprints by PaletteID and naming the palette category path in manual_steps. No new work needed at flip time; this record retroactively marks the already-shipped feature as implemented.</div>"
    manual_steps:
      - step: "UAT: open the roadmap/merit editor, click Palette Finder, click Refresh palette map, then search a known blueprint (e.g. a creature resref) and confirm it reports a sensible Top > Sub > category path."
