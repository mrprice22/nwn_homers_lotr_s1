    notes: "<div>Audited every item players cannot obtain — 2,122 of them — looking for loot or rewards accidentally locked away. <b>Nothing was wrongly locked.</b> No quest key, note, token or reward item is stuck behind a missing droppable flag; the list is genuinely NPC clothing, creature parts, deliberately undroppable boss gear and unplaced orphans. No module change was needed.</div>"
    impl_notes: "<div>module-index/inaccessible_items.json listed ~2,014 items. Spun off from the wiki-missing-creature investigation, which confirmed the name-collapse bug did NOT wrongly mark loot inaccessible (item_carried_by reads all instances; accessibility is gated on Dropable/Pickpocketable, not wiki visibility).</div><div><br></div><div>All 2,122 entries triaged by reason/base-type/carrier/cost/name, then every carried item hand-reviewed: 1,757 are unplaced orphans (out of scope), 150 creature claws/hides (never loot), 18 deliberately named UNDROPABLE/boss items, and all 108 high-value unique-carrier suspects are deliberate boss combat gear — multi-million-gp god items that would be instant contraband under the &gt;750k forge rule. No module change shipped, so there is nothing to verify in-game.</div>"
