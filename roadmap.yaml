    notes: "<div><b>Sowing Discord in Bree</b> — a new daily job for wicked characters (L15+, non-Good need apply). Bill Ferny hands you three forged letters to plant under the Prancing Pony's tables, unseen; when the third lands the Sheriff comes looking, and he comes looking for <i>you</i>. Pays 500-800 gp in morgul-silver and 500 XP, and the first run also earns the <b>Morgul-Weave Cloak</b>. Details: <a href=\"QuestGuide.html#sowing-discord\">Quest Guide → Sowing Discord</a>.</div>"
    impl_notes: "<div>Journal sowing_discord. Fifth consumer of the shared quest-cooldown helper (rolling daily). Branch grafted onto Bill Ferny's existing conversation — his ring quest and other greetings untouched. Gate: total level 15+ and not Good-aligned; Good characters simply never hear the whisper.</div><div><br></div><div>Three Forged Letters (plot+cursed) must each be planted under a <b>different</b> table while in stealth mode (deterministic mode check, fail-retry; a table cannot take a second letter). ~18s after the third plant the Sheriff of Bree (CR-16) and a deputy spawn at that table and attack <b>only the planter</b> via temporary-enemy, so there is no taproom faction war.</div><div><br></div><div>Progress is fully persistent per character UUID (survives relog/reboot, self-heals if letters are lost). No new placements: three existing inn tables retagged and hooked; the sheriff spawns at runtime at an existing table's location. Cloak is skills/saves only, forge-cap-safe. <b>No reputation changes yet</b> — rep integration deliberately deferred until the faction scaffolding item ships.</div>"
