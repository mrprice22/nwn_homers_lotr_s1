      - step: "UAT level gates: the L8 and L15 gates hold (below-level shows a 'come back at N' line)."
        status: done
        step_h: 64
      - step: "UAT nodes 2-3: at L8 the shard is granted; at L15 it is consumed and the Reforged Blade granted; journal advances 1->2->3(End).\n\nResult: at level 8 was able to get the shard -- it should have a property to deal reduced damage (-1) but then also have bleeding 1, and +3 attack bonus -> DONE 2026-07-23 (commit 3007f78): shard now has exactly -1 damage, on-hit bleeding and +3 attack bonus."
        status: done
        step_h: 92
      - step: "UAT restrictions: buckler and blade are unusable by non-fighters."
        status: done
