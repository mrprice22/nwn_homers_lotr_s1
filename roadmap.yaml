    notes: "<div><b>The Last Drop</b> — a new daily social quest for the Shire, and the first to use the new quest cooldown system. The innkeeper puts the custom of the cask to you: five patrons all claim the last drop, and only one has the right of it. Chat them up, pick your winner, and be right for 25 gp and a Frogmorton Pint. The correct claimant rotates with the in-game month, and you get one judgment a day — wrong answers count. Details: <a href=\"QuestGuide.html#last-drop-frogmorton\">Quest Guide → The Last Drop</a>.</div>"
    impl_notes: "<div>Journal tag frogmorton_ale. First consumer of the quest-cooldown library.</div><div><br></div><div><b>Venue adaptation:</b> frogmorton001 turned out to have no inn interior and zero creatures, so the quest lives at the adjacent Whitfurrow Inn using its existing placed hobbits — zero new placements, live immediately; the cask lore still hails from Frogmorton. Rigrin the innkeeper poses the judgment; five commoners became named claimants (Marigold Bunce, Poppy Thistlewool, Hob Broadbelt, Ned Puddifoot, Daisy Goodbody) with clue dialogue.</div><div><br></div><div>The correct claimant rotates with the game-calendar month (12 rules). One judgment per day: a wrong answer is mocked and stamps the cooldown too, so it cannot be brute-forced. The Frogmorton Pint is single-use: 4 hp heal + comedic drunk stagger, no stat effects. Renamed instances were blueprint-split (comfemale002_2/3/4, commale002_2/3) so respawns keep names and conversations — caught by the build's respawn-divergence gate. Docs: card moved from Quest Ideas.html into QuestGuide.html.</div>"
    manual_steps:
      - step: "UAT happy path: at the Whitfurrow Inn ask Rigrin about the cask, chat the five patrons, answer. A right answer pays 25 gp + Pint; drink it for the heal and stagger, and it is consumed."
