  - id: Gear-to-boost-specific-mage-spells
    title: "Gear to boost specific mage spells"
    group: items-gear
    status: design
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-23"
    notes: "<div><em>Original ask:</em> \"An item to improve epic summons would be nice, not to make them more tanks, but more dps so they do something vs higher bosses. Or a way to improve spells in general, obviously there are a lot of spells that can't be used as they are — mobs are just immune to them. Like an item to change implosion to do 'chaos' dmg instead of death. As a whole for casters there are very little ways to kill something, its either damage shields, IGMS or epic spell lucky rolls for the majority. So some boosting to lvl 9 spells would be nice.\"</div><div><br></div><div><strong>The problem.</strong> Against high-tier bosses casters hit a wall: bosses are immune to death/instant-kill and to whole swaths of spells, so the only reliable answers left are damage shields, IGMS, and lucky epic-spell rolls. There is no way to make a favourite spell — or your epic summons — actually matter at the top of the roster.</div><div><br></div><div><strong>Concept: caster gear that <em>drops from high-tier bosses</em>.</strong> Each piece is a single equippable that flags its wearer on equip; a scripted hook then reads that flag plus the spell being cast and adjusts the outcome. Four archetypes:</div><ul><li><strong>Spell / School Amplifier</strong> — multiplies a chosen spell's or school's damage by a capped % (e.g. \"Evocation +25%\", or a single named spell). Rides the same spell-id effect-scaling machinery the module already uses to double spell durations.</li><li><strong>Damage Retyper</strong> — rewrites a spell's damage <em>type</em> to an <strong>existing</strong> type the target isn't immune to (e.g. Implosion's death damage → magical or negative), so immune bosses still take the hit. <em>No new damage type is being invented here</em> — this maps only onto existing NWN types; the separate forge \"true damage type\" idea is out of scope for this item.</li><li><strong>Summoner's Gear</strong> — pushes a summon's attack/damage output (DPS, not tankiness — exactly as asked) up to where it matters against high-CR bosses, extending the existing summon-scaling that already boosts summons at spawn.</li><li><strong>Focus / Caster-Level Gear</strong> — temporarily bumps caster level or save DC for a chosen school so save-based level-9 spells can actually land on high-CR targets. The trickiest to balance — treat as a stretch tier.</li></ul><div><strong>Feasibility.</strong> No native item property can boost a specific spell, so all four are scripted — but the plumbing already exists in the module: tag-based equip markers, the spell-cast hook (the same one that runs the Meaningwave counterspell), the spell-id effect-scaling handler that doubles durations, and the summon-boost hook. Reuse, not new engine work.</div><div><br></div><div><strong>Open questions.</strong> One dedicated slot with hard % caps and no stacking of the same effect; which specific spells/schools ship first; and the drop sources / rarity across the boss roster.</div><div><br></div><div><strong>Starter catalogue (2026-07-09).</strong> A concrete first draft of <strong>20 items — five each for Cleric, Druid, Sorcerer and Wizard</strong> is written up, with signature effects, damage dice / caster-level scaling, stat lines tiered to each source boss's challenge rating, and a thematic boss drop for every one (all existing, reachable bosses — no new areas needed). A new design pillar rewards <strong>pure single-class casters</strong> with a stronger version of every effect. See the full table on the wiki: <a href=\"https://homerslotr.com/manual/CasterGear\" target=\"_blank\" rel=\"noopener\">Caster Signature Gear</a> (linked from <a href=\"https://homerslotr.com/manual/Customizations#caster-gear\" target=\"_blank\" rel=\"noopener\">Customizations → Notable Custom Systems</a>).</div>"
    impl_notes: "<div><b>Feasibility re-confirmed (autopilot 2026-07-23):</b> no native item property boosts a specific spell, so all four archetypes are scripted, but the plumbing already exists — tag-based equip markers, the module spell-cast hook (same one running the Meaningwave counterspell), the spell-id effect-scaling handler that doubles durations, and the summon-boost hook (summon_boost.nss). The Damage Retyper is the most mechanically contained archetype (a single OnCast interception that swaps an existing damage type) and directly answers the core complaint (bosses immune to death/instant-kill). This is parked rather than built because every archetype shifts high-tier boss balance and the slot/cap/drop policy is the admin's call — see the design questions; on approval the MVP is a small, well-scoped build.</div>"
    design_questions:
      - question: "MVP SCOPE - which archetype ships first? Proposed: the DAMAGE RETYPER as the pilot (most contained + directly fixes the immunity wall). Concrete first slice = 3 amulets that retype a chosen death/instant-kill spell's damage to an existing type the boss is not immune to: (a) Implosion death->magical, (b) Wail of the Banshee death->negative, (c) Finger of Death death->negative. Each is one equippable that sets a PC flag on equip; the existing spell-cast hook reads the flag + the spell id and rewrites the damage. Approve Damage Retyper as MVP, or start with Summoner's Gear (extend summon_boost.nss for DPS) / Spell Amplifier instead?"
        status: open
        answer: null
      - question: "SLOT / CAP / STACKING POLICY (needed before any archetype ships). Proposed: ONE dedicated equip slot for this whole system (suggest amulet OR ring - which?), a hard per-effect cap (e.g. Amplifier +25% max, Focus +2 caster level / +2 DC max), and NO stacking of the same effect (two Evocation amplifiers do not add). This keeps casters relevant without trivialising bosses. Approve the slot choice + caps, or set your own numbers?"
        status: open
        answer: null
      - question: "CATALOGUE SOURCE. A 20-item 'Caster Signature Gear' starter catalogue (5 each for Cleric/Druid/Sorcerer/Wizard, with signature effects, scaling, per-boss drops, and a pure-single-class bonus pillar) already exists on the wiki (Customizations -> Caster Signature Gear). Should the MVP build a scoped SUBSET of that catalogue (e.g. just the 3 Damage Retyper amulets above, each from its listed boss), or do you want to revise the catalogue first? Confirm the drop sources are still the intended bosses before anything is placed."
        status: open
        answer: null
    manual_steps:
      - step: "On approval this becomes a scripting build (equip-flag include + spell-cast-hook interception + the approved item blueprints + boss-drop placement) - re-promote to confirmed. The item blueprints will need palette filing and appearance/equip UAT; boss-drop placement is a per-boss .utc ItemList edit (existing bosses, no new areas)."
        status: open
  - id: respawn-tracker-well-of-eru
    title: "Respawn Tracker in Well of Eru"
    group: bosses
    status: awarded
    type: Enhancement
    player: "dc0960 (Dungeon_Crawler)"
    date: "2026-07-05"
    commit: 5c627769fc7, 1438125629d, 0ddc3a510fc, 0d72ceb0a08
    notes: "<div>Original ask: \"would a board in well of eru with bosses that are dead and showing how long till respawn be worth it or are respawn times short enough? Standardizing the boss respawn rate and maybe adding drop rates to the loot would be a nice complimenting feature to the bestiary\"</div><div><br></div><div>Shipped as the '<a href=\"https://homerslotr.com/manual/Customizations#boss-respawn-tracker\" target=\"_blank\" rel=\"noopener\">Roll of the Fallen</a>' board next to the Recent Updates sign in the Well of Eru. It lists only bosses that are currently slain, mightiest (highest CR) first, with time-to-return at the end of each name; click a boss to see its lair and the player or party who last slew it (from the bestiary's damage-contributor tracking). Only bosses that can ever have one live copy at a time are tracked (20 bosses: Balrog, Shelob, Kerufall, Xanith, Legolas, both Khamuls, Theoden's Chosen, Gandalf, High Wizard, Sauron, Gwathdor Lord, Boromir, Denethor, Witch King, Radagast, Heir of Haldor, Smaug, Gollum, Thranduil).</div><div><br></div><div>Boss respawns standardized to 15 minutes across the board: encounter bosses' ResetTime lowered from 20-150 min (Shelob 50m, Kerufall 58m, Khamul/Legolas 20m, weathertop-class 100m, Bilbo 150m) to match the Balrog's 15m and the placed-creature respawn; Thranduil, the Carn Dum Khamul and the Heir of Haldor previously never respawned until reboot and now respawn in 15m too. Drop-rate info on the bestiary (the note's last idea) was left out of scope.</div><div><br></div><div><strong>Update:</strong> the boss list is no longer hand-curated. It is now generated from a rule (bin/gen-boss-registry.py): every creature with challenge rating above 60 that can only ever have one live instance at a time, excluding plot/immortal and merchant/utility NPCs. This grew the tracked set from 20 to <strong>78 bosses</strong> — adding the likes of Aragorn, Gimli, Glorfindel, Sarah the Librarian, Gothmog Lord of Barad-Dur, the Rancid Skinner, Summanus, the Basilisk King and dozens more. The in-game board and the wiki <a href=\"https://homerslotr.com/creatures/bosses\" target=\"_blank\" rel=\"noopener\">Creatures → Bosses</a> page are generated from the same registry, so they always match. Encounter bosses keep their real respawn timers (accurate countdowns). The three placed bosses whose death scripts didn't respawn them (the Rancid Skinner, Wart Gondorian Gate Captain and Fell Beast) were fixed to the standard 15-minute respawn.</div>"
