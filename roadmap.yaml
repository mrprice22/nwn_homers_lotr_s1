    notes: "<div>Druid and ranger summons and animal companions now scale with their master's power the moment they spawn, so late-game pets stay relevant on this high-magic server. The boost grows with your class level, your Animal Empathy, and the Conjuration spell-focus feat line — up to +20 attack, +12 dodge AC, +20 all saves and +24 to every ability score. It is permanent and cannot be dispelled. Other classes' summons are unaffected. Details: <a href=\"Customizations.html#scaled-summons\">Customizations → Scaled Summons &amp; Animal Companions</a>.</div>"
