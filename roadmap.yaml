  - id: epic-summon-unsummon
    title: "Epic Summons don't unsummon when dismissed"
    group: combat-classes
    status: awarded
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: 278a891c10c
    notes: "<div>Epic summons no longer stay behind when you dismiss them. Since epic summons became henchmen, kicking one from your party left it standing where it was instead of unsummoning it. Now it puffs away properly, with the usual unsummon effect — whether it is dismissed, expires or is replaced.</div>"
    impl_notes: "<div>Root cause: the epic-as-henchman change (bdab134bd5a) put the Mummy Reaper and Dragon Knight on the henchman slot, but the party-kick flow only calls RemoveHenchman — it never destroys the creature and fires no module event, so the epic was left standing with stale tracking.</div><div><br></div><div>The two epic blueprints now run a custom heartbeat (epic_summon_hb) that runs the stock henchman AI, then despawns the creature with the unsummon VFX if it has been orphaned (no master). The scripted dismiss/expire/replace paths also gained the unsummon VFX. Meaningwave companions and other henchmen are untouched.</div>"
    manual_steps:
      - step: "UAT: summon an epic, kick it from the party -> it should puff away within ~6s."
        status: open
        step_h: 64
      - step: "UAT: immediately cast the other epic -> it spawns normally."
        status: open
        step_h: 64
      - step: "UAT regressions: an epic plus a normal animal summon still coexist; a second epic still replaces the first; duration expiry still despawns it; Meaningwave guide dismissal is unchanged; and logging out with an epic active leaves nothing lingering."
        status: open
        step_h: 64
  - id: hgll-skill-point-exploit
    title: "Legendary Level Skill Points Exploit"
    group: combat-classes
    status: awarded
    type: Exploit
    player: "Rajmund (Ray)"
    date: "2026-07-13"
    commit: b4daa68f18e
    notes: "<div><span>Epic leveling: you get N skill points. When spending, it raises the skill. Then when you are down to 1 point, you pick something but choose to start over. </span></div><div><span>You start anew with all the skill points to spend. But you keep the N-1 skill points spent.</span></div><div><span><br></span></div><div><span>DM: Fixed. The leveler applied each pick the instant you confirmed it, but only spent the level itself on the very last confirmation — so backing out (or walking away, or disconnecting) kept the picks and left you eligible to level again. The same hole handed out unlimited <b>feats and ability points</b>, not just skill points.</span></div><div><span><br></span></div><div><span>The level-up is now a single transaction: nothing touches your character until you confirm on the final page, and then it all applies at once. \"No. I want to start over.\" now genuinely starts you over, with your full pool back.</span></div>"
