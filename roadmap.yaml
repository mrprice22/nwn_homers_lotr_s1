  - id: ab-enhance-stack-bug
    title: "Weapons with both Attack Bonus (AB) and Enhancement Bonus (EB) appear to mis-calculate stats"
    group: combat-classes
    status: awarded
    type: Defect
    player: "Piskan (Alec Cain)"
    date: "2026-06-23"
    notes: "<div>Weapons carrying both an Attack Bonus and an Enhancement Bonus were misleading you: the NWN engine applies only the higher of the two to your attack roll, so any Attack Bonus at or below the Enhancement Bonus was dead weight on the character sheet. This is hardcoded engine behaviour with no toggle, so every weapon in the module was audited instead — 253 weapons had the two properties collapsed into a single Enhancement Bonus, raised to a balanced value where the old Attack Bonus was higher. Copies already in your inventory were repaired automatically.</div><div><br></div><div><b>If you keep old copies in the Bank of Bree</b>, take them out and leave them in a character's inventory overnight — the nightly 3am reboot scans character files, not storage boxes, so banked items will not be fixed until they are carried.</div>"
    notes_h: 258
    impl_notes: "<div>Root cause is hardcoded NWN engine behavior, not a module bug: the Attack Bonus property and the <i>attack component</i> of the Enhancement Bonus property do not stack — the engine applies only the higher of the two to the attack roll — while the enhancement's damage and damage-reduction bypass always apply.</div><div><br></div><div>First pass: 199 weapons (blueprints plus all placed/inventory instances) carried both a generic Attack Bonus and Enhancement Bonus; each was collapsed to a single Enhancement Bonus, with a balanced per-item value where Attack Bonus exceeded Enhancement. Driven by bin/ab-enhance-audit.py -&gt; ab-enhance-audit.csv -&gt; bin/ab-enhance-apply.py.</div><div><br></div><div><b>Follow-up (player report: Chosen Kama still +13/+13):</b> the first pass matched the Attack/Enhancement properties only when their unused subtype was encoded as 0, but NWN also encodes it as 65535 (0xFFFF). That hid 54 more weapons (Chosen Kama, the Tournament set, Spear of Destiny, Super Kama, Mindmelter and others) from the audit, the blueprint collapse <i>and</i> the player-inventory repair. All three tools now treat subtype 0 or 65535 as generic; the 54 were collapsed and the server vault re-swept, fixing carried copies in players' character files.</div>"

