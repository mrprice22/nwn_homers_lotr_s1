    impl_notes: "<div>Journal category rng_path (@group 'Class Lines' @order 7). Giver q_rng_keep (Halbarad, Ranger 30, plot/immortal) in rangerwaystation; offer gated on GetLevelByClass(CLASS_TYPE_RANGER) &gt;= 1, non-rangers get a flavour brush-off. Structurally cloned from the shipped cleric-line-early template.</div><div><br></div><div>Three-node one-off arc; per-character state in the rnglinedb campaign DB (key path_stage 0-&gt;3, advance-only). Rewards q_rng_broc (+1 DEX amulet), q_rng_star (plot token), q_rng_bow (BaseItem 8 longbow, Enhancement +2 / +1 DEX); Use-Limitation:Class subtype 7 = Ranger, verified against existing ranger-restricted items.</div><div><br></div><div>Waystation OnEnter wrapped q_rng_enter (chains the existing leash_to_area) -&gt; q_rng_spawn; conversation q_rng_conv, StartingConditionals q_rng_c_off/s1w/s1r/s2w/s2r/dn, reply scripts q_rng_oath/tok/rtn. DLG follows the reply-gate rule (verified no action script in any Active field). Build passed all gates (7/7 smoke tests, dialog integrity).</div><div><br></div><div>Resumed half-built prior work from 0b71d6908a4, which had shipped the q_rng_* scripts and reward UTIs with no giver, dialog, journal or area wiring — nothing was reachable. Also fixed q_rng_bow, authored as BaseItem 6 (heavy crossbow) despite its name, to 8 (longbow). Kept the pre-existing q_rng_ prefix rather than q_rgr_ to avoid orphaning 15 committed files. No capstone built — deferred to ranger-line-mid/endgame.</div>"
