    notes: "<div><b>The Fall</b> — the Blackguard initiation, and the twelfth and final order, completing Halmir's hub. Swear the Black Oath at the torture-rack in the Keep of Barad-dûr while wounded. <b>This one marks you: it shifts your alignment permanently toward evil</b>, once and only once. Pays 1,000 XP and the <b>Sigil of the Fallen</b> (Bluff +3, UMD +3, saves vs. negative +3). Details: <a href=\"QuestGuide.html#blackguard\">Quest Guide → Blackguard</a>.</div><div><br></div><div><br></div><div>-- This module (normally) allows FREE alignment changes in bree appearance changing area, and free faction shifts to evil or good from well of eru</div><div>--&gt; update 'this one marks you' so that you can NO LONGER use the good teleporter in well of eru and no longer use the alignment adjuster</div>"
    impl_notes: "<div>Journal pc_blackguard; prestigedb key 'blackg', one-off, relog-safe. Cloned exactly from the Divine Champion skeleton (prsg_inc framework, prestigedb stage idiom). Offer requires 1+ Blackguard level (CLASS_TYPE_BLACKGUARD = 31); non-Blackguards at L14+ get the existing pointer line.</div><div><br></div><div>Uses existing placed instance 94 of plc_torture1 in the Keep of Barad-dûr, retagged BkgFallAltar with Static cleared and OnUsed q_bkg_altar added; it had no prior script or tag references so nothing was chained or broken. The wounded check is GetCurrentHitPoints &lt; max, deterministic, no dice.</div><div><br></div><div>The alignment shift is the order's signature mechanic: AdjustAlignment(oPC, ALIGNMENT_EVIL, 50, FALSE) applied on the stage 1-&gt;2 transition only, so it is non-farmable and the re-give-brand path never re-shifts. Brand of the Fall is plot+cursed. Reward skills distinct from the eleven siblings, no AB/damage so forge-cap-safe. No new waypoint or placement. Build passed all gates.</div><div><br></div><div><b>Faction oath-lock (2026-07-23, commit da33a3c):</b> the Black Oath fall (q_bkg_altar, stage 1-&gt;2) now also calls Faction_SetOath(oPC,\"Evil\") — it commits the character to the Evil (Sauron) faction and locks them out of the Good/Free-Peoples Well of Eru light-shaft. Optional, one-time, non-farmable (same stage guard as the alignment shift). See [[faction-scaffolding]].</div>"
    manual_steps:
