  - id: jailed-for-appearance-crafting
    title: "Item appearance crafting can send you to prison"
    group: forge
    status: awarded
    type: Defect
    player: "Rajmund (Ray)"
    date: "2026-07-04"
    commit: 7f9759ebb24
    notes: "<div>Changing an item's appearance could get you thrown in prison on your next login. Recolouring or reshaping an item quietly stripped the mark that proves it was forged legally, so the contraband scan then judged a perfectly lawful item as illegal. Dyeing and reshaping now carry that mark across the edit, so legitimate gear stays legal.</div>"
    impl_notes: "<div>Root cause confirmed: recolouring/reshaping rebuilds the item via CopyItemAndModify, which dropped the item-local FORGE_CEIL exemption stamp; the login / Well-of-Eru contraband scan then re-judged a lawfully-forged &gt;750k item as illegal and jailed the bearer — on the next login or Well entry, not immediately. The dye/appearance paths now carry FORGE_CEIL/FORGE_CLEAN across the edit.</div><div><br></div><div>Originally suspected to be an instance/blueprint desync related to <a href=\"#idea-dedupe-item-tags\">duplicate item tags</a>; that turned out not to be the cause here.</div>"
