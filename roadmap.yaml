    commit: 765fb4e3546
    notes: "<div><b>Hobbit Post</b> — a new T1 Shire daily. Posco Whitfoot, Hobbiton's new post-master, hands you one sealed parcel a day, addressed to a different neighbour depending on the day. Pays 60 gp and 50 XP, plus 40 gp if you make the run in under five minutes — and once in a while the parcel is misaddressed, which pays better if you chase down the true owner. Details: <a href=\"QuestGuide.html#hobbit-post\">Quest Guide → Hobbit Post</a>.</div>"
    impl_notes: "<div>Journal tag hobbit_post. Second consumer of the quest-cooldown library. Posco is a renamed existing hobbit instance — zero new placements.</div><div><br></div><div>Recipient rotates by game-calendar day across five existing NPCs: Daddy Twofoot (Hobbiton), Old Noakes (Bywater), the Green Dragon's Keeper, Salvia Brockhouse and Milo Burrows (Whitfurrow Inn). Speed bonus uses real-world epoch timing that survives relogs — the design's GetTimeSecond idea was not relog-safe. 8% misdelivery twist: the labelled recipient redirects to the true owner for +60 gp and a random small item.</div><div><br></div><div>The parcel is plot+cursed and carries its own day/timestamp state so calendar flips cannot strand it; re-offers replace rather than duplicate. Renamed instances blueprint-split so respawns keep names (build gate verified). Design deviations: recipients kept within the reachable Shire (Bilbo's House unreachable, Maggot is a CR 436 boss), and the treasure_post chest became a random-loot payout script. Docs: card moved from Quest Ideas.html into QuestGuide.html.</div>"
    manual_steps:
      - step: "UAT happy path: accept from Posco in Hobbiton, deliver to the named recipient -> 60 gp + 50 XP, +40 gp if under 5 minutes."
        status: open
      - step: "UAT cooldown: re-ask -> come-back line with time to UTC midnight; resets the next UTC day."
        status: open
      - step: "UAT rotation: the addressee changes with the game calendar day, and only that recipient accepts."
        status: open
      - step: "UAT misdelivery (8%): refusal + redirect; the true owner pays extra plus a random item."
        status: open
      - step: "UAT duplication guard: re-talking to Posco replaces the parcel, the payout destroys it, and there is no double pay."
        status: open
      - step: "UAT regression: Green Dragon room rental still works parcel-free; renamed NPCs keep names after respawn; the Frogmorton quest is untouched."
        status: open

