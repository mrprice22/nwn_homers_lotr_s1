  - id: lumber-ent-tugofwar
    title: "Quest pair: Lumber Runners (Evil) vs Ent-Watch (Good), Fangorn dailies"
    group: quests-areas
    epic: quest-overhaul
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    notes: "<span>T2 (L15+). A linked server-state tug-of-war — a shared isengard_warmachine var scales the Helm's Deep event. Ship the pair together. Depends on cooldown helper + world-state tick logic.</span>"
    impl_notes: "<div><b>Dependency audit (autopilot 2026-07-23):</b> the item's note 'Depends on cooldown helper + world-state tick logic' is now half-stale. The <b>quest-cooldown helper already exists</b> — quest_cd_inc.nss (QCD_IsOnCooldown / QCD_IsDoneToday / QCD_IsDoneThisWeek / QCD_Stamp, backed by the questcddb campaign DB, real wall-clock, survives reboots) — so carndum-ledger, faramir-watch and palantir-watch are NOT blocked on cooldowns, only on world-state. The genuinely-missing infra is a shared <b>world-state</b> layer: server-wide persistent variables (not per-character) that several players read/affect and that change over time. See the design question for the proposed shared helper; once approved it unblocks this pair plus claim-the-deeps (deeps_control), goblin-town-throne (7-day halved-orc-spawn buff), and the Helm's Deep scaling here.</div><div><br></div><div><b>Shared world-state helper BUILT 2026-07-23 (commit 0b17611), independent of this quest:</b> worldstate_inc.nss over campaign DB worldstatedb — WS_GetInt/WS_SetInt/WS_AdjustInt (server-wide int globals, optional clamp), WS_GetStr/WS_SetStr (e.g. a weekly-claim owner pckey), WS_RegisterDecay(key,rate,target,period) / WS_RegisterWeekly(key,resetTo) / WS_ClearRule, and a self-throttled WS_Tick() (~1/min) wired into the module heartbeat bleeding.nss (after the existing PC loop, petrify/bleed logic untouched). Real wall-clock via strftime, survives reboots. This resolves the infra dependency for this quest AND for claim-the-deeps (deeps_control), goblin-town-throne (7-day buff via period=604800), and mithril-seam (weekly claim). What remains open for THIS item is only the tug-of-war mechanic below.</div>"
    design_questions:
      - question: "SHARED WORLD-STATE HELPER (the real second infra unblocker; the cooldown helper already exists as quest_cd_inc.nss). Proposed: a thin include 'worldstate_inc.nss' over a 'worldstatedb' campaign DB — WS_GetInt/WS_SetInt/WS_Adjust for server-wide persistent globals plus a ~1/min WS_Tick for per-key decay/weekly reset."
        status: answered
        answer: "Approved: Campaign DB + heartbeat tick + decay. Build worldstate_inc.nss + worldstatedb + WS_Tick as shared infra (autopilot is building this independently of the tug-of-war quest, which still needs its mechanic decision below)."
      - question: "LUMBER/ENT TUG-OF-WAR MECHANIC (creative/balance, needs your call). Concept: a shared isengard_warmachine world-state var that both sides push — players felling trees / aiding Isengard raise it, players defending Fangorn / doing Ent objectives lower it — and its value scales the difficulty/rewards of the linked Helm's Deep event ('ship the pair together'). Open: what raises/lowers it and by how much per action, the min/max clamp, whether it decays toward centre over time (via WS_Tick), and what the Helm's Deep event does at each band. Proposed starting point: range 0-100, start 50, +/-5 per qualifying action, decay 1/hour toward 50, three difficulty bands (<=25 / 26-74 / >=75). Approve/tweak, and confirm the two areas (Fangorn + Helm's Deep) to wire."
        status: open
        answer: null
    manual_steps:
      - step: "DONE: shared world-state helper built (commit 0b17611 — worldstate_inc.nss + worldstatedb + WS_Tick heartbeat). Remaining for this quest: build the tug-of-war scripts + Helm's Deep scaling once the mechanic below is approved, then re-promote to confirmed. The cooldown half needs nothing new (quest_cd_inc.nss exists)."
        status: open
      - step: "UAT the world-state helper (infra): as DM, WS_RegisterDecay(\"uat_ws\",1,0) + WS_SetInt(\"uat_ws\",5); after ~5 min confirm WS_GetInt(\"uat_ws\") has decayed toward 0 (~1/min via the heartbeat), and confirm a set value survives a server restart (worldstatedb persistence). WS_Clear(\"uat_ws\") to tidy."
        status: open

