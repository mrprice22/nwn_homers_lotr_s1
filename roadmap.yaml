      - step: "UAT the Active-field fix specifically: confirm the swear-oath, receive-shard and reforge replies are now selectable (they were hidden before commit 01b242056d0).\n\nResult: What shard? What reforge replies? -> RESOLVED 2026-07-23: the flow works end to end in later UAT (shard obtained at L8); the earlier confusion was a stale-module test before 01b242056d0."
        status: done
