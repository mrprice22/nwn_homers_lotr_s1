  - id: concerning-hobbits
    title: "Quest: Concerning Hobbits (Shire genealogy)"
    group: quests-areas
    epic: quest-overhaul
    status: design
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-17"
    commit: 7ed910b39b3
    notes: "<div><b>Concerning Hobbits</b> — a new T1 daily (L5) in Hobbiton. Odo Proudfoot is deep in a genealogy dispute and wants five questions of Shire lineage settled. Four right pays 40-100 gp, 100 XP and a pouch of pipe-weed; a perfect five upgrades the keepsake to a <b>Greater Ring of Scholars</b>. The dispute — and the answers — change with the season, and the whole server argues over the same one. Details: <a href=\"QuestGuide.html#concerning-hobbits\">Quest Guide → Concerning Hobbits</a>.</div>"
    notes_h: 353
    impl_notes: "<div>Journal tag concern_hob; custom tokens 6420-6428; all logic in q_hob_inc.nss. Built on the established riddle-game pattern (token-driven dialogue, StartingConditional Active scripts, quest_cd_inc/questcddb, journal wiring).</div><div><br></div><div>Odo Proudfoot (q_hob_odo) draws five questions from a bank of 16 canon Tolkien-genealogy questions; question set and answer order are seeded from the in-game calendar season (GetCalendarYear()*4 + season, stride walk over the bank), so the correct answer rotates each season and the whole server shares one seasonal dispute. Rewards witchbud and grscholar, both verified existing module blueprints.</div><div><br></div><div>Daily gate (QCD_IsDoneToday) applies win or lose, finalized atomically on the fifth answer so escape-closing cannot dodge the stamp or double-pay. Hobbiton OnEnter wrapped (q_hob_enter chains leash_to_area then q_hob_spawn); giver spawns at AP_concerninghobbits_1; conversation q_hob_conv on the blueprint.</div>"
    design_questions:
      - question: "The original card's reward was 'Bag End housing access (owner-check workaround, no instancing)'. That is design-sensitive &mdash; which door and interior, persistent housing entry vs. a campaign flag, and what eviction semantics apply &mdash; so a concrete gold/XP/keepsake reward shipped instead and the housing piece was deferred. Should housing access be added later as a win-hook in QHOB_PayOut, and if so on what terms?"
        status: open
        answer: null
    manual_steps:
      - step: "Place waypoint AP_concerninghobbits_1 in shirehobbiton001. Odo is script-spawn-only and the scripts no-op gracefully until the waypoint exists, so the quest is unreachable without it."
        status: open
        blocker: true
      - step: "UAT: enter Hobbiton, talk to Odo, accept -> journal concern_hob opens."
        status: open
      - step: "UAT rewards: answer the five questions &mdash; 4/5 pays 40-100 gp + 100 XP + pipe-weed; a perfect 5/5 gives the Greater Ring of Scholars; the journal closes on finish."
        status: open
      - step: "UAT cooldown: re-ask the same day -> 'come back tomorrow' countdown to 00:00 UTC; resets the next UTC day. DM can reset with QCD_Clear."
        status: open
      - step: "UAT rotation: the offered question set and answer positions differ across in-game seasons."
        status: open
      - step: "UAT exploit guard: escape-closing on the fifth answer still stamps and pays exactly once (no double-pay)."
        status: open

