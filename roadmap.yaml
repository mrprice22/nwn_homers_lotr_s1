    notes: "<div><b>The Riddle Game</b> — a new weekly minigame, open to any level. Something wretched and whispering lurks in the Bree Cave and wants to play the old game: seven riddles, and you must answer five to win. The set changes every week and everyone on the server faces the same one. Winning pays 100-300 gp, 250 XP and a trinket. One attempt a week, win or lose. Details: <a href=\"QuestGuide.html#riddle-game\">Quest Guide → The Riddle Game</a>.</div>"
    impl_notes: "<div>Journal tag riddle_game. Fourth consumer of the quest-cooldown library (QCD_IsDoneThisWeek). The Whispering Wretch is a plot, friendly CR-1 clone of the Gollum blueprint, strongly implied to be but never named him; the placed CR-1029 Gollum boss is untouched and still Roll-of-the-Fallen tracked.</div><div><br></div><div>Bank of 16 riddles (8 classic Hobbit riddles reworded + 8 originals in the same voice), served via a token-driven generic riddle node. The weekly set is server-wide (ISO-week seed, 128 weekly variants) and answer order rotates. One attempt per calendar week: the stamp and payout both land on the seventh answer so closing the window cannot dodge either; mid-game relogs restart the same weekly set without spending the week. Waypoint AP_riddle-game_1 in breecave (looked up hyphen-stripped as AP_riddlegame_1).</div><div><br></div><div><b>Follow-up fix (commit 62272db):</b> the first UAT hit an UNRECOGNIZED TOKEN screen. Root cause: the token-setting StartingConditional q_rid_c_show (sets riddle number/verse/answer tokens 6361-6366) compiled and shipped but was never attached as the Active script on any of the four dialogue links into the riddle node, so it never ran and the tokens were never set. Attached it to all four links; as a side benefit its guards now properly gate the node so a stale 'Next riddle' click after game end cannot show a garbage riddle. Token range 6360-6368 verified collision-free.</div>"
    manual_steps:
      - step: "Place waypoint AP_riddle-game_1 in breecave. Until then the cave behaves exactly as before."
        status: done
        step_h: 64
      - step: "UAT re-test after the token fix (needs a deploy/restart): start the game and expect 'Riddle 1 of seven...' with a real verse and four distinct answers; play all seven (right/wrong quips render, answer letters rotate); the win/lose finale shows the score; a second attempt the same week gets the countdown refusal."
        status: open
        step_h: 64
      - step: "UAT win path: 5+/7 pays gold/XP/trinket on the seventh answer and closes the journal."
        status: open
        step_h: 64
      - step: "UAT lose path: taunts, nothing paid, week still stamped."
        status: open
