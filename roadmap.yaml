  - id: boss-stat-tuning-pass
    title: "Per-boss stat tuning: close dumped saves, swap flat DR for % immunity gear, raise auto-hit AC into the ~85 gate window"
    group: bosses
    epic: difficulty-increase
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: f3ff201f85f
    notes: "<div>Ten of the server's bosses had a glaring hole in their defences — a dumped save or an auto-hit AC that made them far easier than their reputation. They have been tuned: no HP inflation, no CR changes, just closing the gaps. Expect the Witch King, Smaug, Summanus, the Gwathdor Lord, Sauron, Gandalf, Boromir, Denethor, the Temple Mistress, Legolas and Theoden's Chosen to punish a mediocre build far more than they used to. Full per-boss numbers: <a href=\"https://homerslotr.com/manual/boss-updates#recipe\">Endgame Difficulty design brief</a>.</div>"
    impl_notes: "<div>First deliverable of <a href=\"#idea-higher-difficulty-ceiling-revamp\">the higher-difficulty-ceiling umbrella</a> — pure blueprint data edits, no HP inflation and no CR-label changes.</div><div><br></div><div>Priority A (glaring single hole): Smaug (Ref +0), Summanus (Will +0), Gwathdor Lord (Will +5), Sauron the Abhorred (Fort +4, AC 65), Gandalf the Gray (Will +10, AC 63), with the Witch King as the worked example. Priority B (auto-hit AC / missing immunity gear): Boromir, Denethor, Temple Mistress, Legolas, Theoden's Chosen.</div><div><br></div><div>Applied to all ten: blueprint and placed instance edited in lockstep (encounter-spawned Summanus/Legolas are blueprint-only). Witch King had been marked DONE in the brief but was never actually applied — applied now (NaturalAC 0-&gt;30, Fort 0-&gt;27, Ref 3-&gt;15, Will 13-&gt;22); Smaug Ref 0-&gt;25 / Will 0-&gt;22; Summanus Will 0-&gt;30 / Fort 0-&gt;20; Gwathdor Lord Will 0-&gt;27; Sauron Fort 0-&gt;28 / AC+20; Gandalf Will 0-&gt;18 / AC+22; Boromir AC+20; Denethor Ref 0-&gt;18 / AC+13; Temple Mistress AC+18 and Legolas Fort 0-&gt;12 with npcbuffgear immunity skins; Theoden's Chosen given the real bossring + npcbuffgear skin.</div>"
    manual_steps:
      - step: "Follow-up noted but not done (beyond pure-data scope): a damage rider for Theoden's Chosen &mdash; his low AB offense remains."
        status: open
        step_h: 64
      - step: "UAT: the Witch King should examine at ~AC 86 (was 56) and resist Knockdown / save-or-die."
        status: open
        step_h: 64
      - step: "UAT: Smaug no longer auto-fails Reflex spells, and Hold Monster on Summanus now needs a real DC."
        status: open
        step_h: 64
      - step: "UAT power curve: a ~+70 AB character should whiff most swings on Sauron / Gandalf / Boromir / Denethor / Temple Mistress, while a maxed +85-90 build still connects."
        status: open
        step_h: 64
      - step: "UAT immunities: Temple Mistress, Legolas and Theoden's Chosen visibly resist ~50% of single-type physical damage."
        status: open
        step_h: 64
      - step: "UAT persistence: kill and respawn one boss (e.g. the Witch King) and confirm the respawned copy keeps the tuned stats."
        status: open
        step_h: 64
  - id: boss-enrage-on-retreat
    title: "Enrage-on-retreat: registry bosses taunt, gain +2 all stats for that life, and heal 25% of missing HP when a player disengages"
    group: bosses
    epic: difficulty-increase
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-13"
    commit: 044c61c14fa
    notes: "<div>Retreating from a boss now costs you. Every time you disengage from a Roll-of-the-Fallen boss, it taunts you by name, permanently gains +2 to all stats for the rest of that life, and heals a quarter of the damage you had done. Potion-attrition and tank-and-retreat no longer work — the winning line is one sustained, properly-geared engagement. Dying is not retreating; logging out is. The enrage never carries onto a respawn. Design: <a href=\"https://homerslotr.com/manual/boss-updates#enrage\">boss-updates#enrage</a>.</div>"
    impl_notes: "<div>Pure script on existing plumbing: new enr_inc.nss plus one call from bst_ondamage.nss. Scope is strictly the CR&gt;60 single-instance Roll-of-the-Fallen registry bosses; registry scoping is a cached query against respawndb's boss_registry so it always matches the board.</div><div><br></div><div>Left-combat detection is a hybrid: engagement rides the bestiary's OnDamaged wrapper (summons/pets resolve to the owning PC); disengagement is a boss-side 6s pseudo-heartbeat that only runs while someone is engaged. An engaged PC out of the area, beyond 40m, or logged out for ~12s counts as retreated.</div><div><br></div><div>Each retreat: shout taunt naming the PC, +2 all six abilities (supernatural, undispellable, stacks per retreat, dies with the creature so it can never persist onto a respawn), instant heal of 25% missing HP with a buff VFX. Ships with <a href=\"#idea-heal-soul-fatigue\">soul-fatigue on Heal</a>, which is what removes fatigue's 'retreat and wait out the stacks' escape hatch.</div>"
    manual_steps:
      - step: "UAT: damage a registry boss, then run >40m or leave the area &mdash; within ~12-18s it should taunt you by name, flash a VFX, regain HP and examine at +2 stats."
        status: done
        step_h: 64
      - step: "UAT stacking: retreat again and confirm the +2 stacks."
        status: done
        step_h: 64
      - step: "UAT respawn: kill it and wait out the respawn &mdash; base stats, no carried enrage."
        status: done
        step_h: 64
      - step: "UAT party: a second player still fighting while the first retreats &mdash; enrage still fires."
        status: done
        step_h: 64
      - step: "UAT negatives: dying to it fires nothing, and retreating from a non-registry high-CR mob does nothing."
        status: done
        step_h: 64
  - id: heal-soul-fatigue
