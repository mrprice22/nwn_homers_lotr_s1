  - id: Elronds-Sword-Bugged
    title: "Jailed for Elrond's Sword (unmodified)"
    group: forge
    status: awarded
    type: Defect
    player: "Zambro (Xil)"
    date: "2026-07-01"
    commit: 1204b88d546
    notes: "<div>Carrying the Longsword of Elrond — unmodified, straight from the world — could land you in jail, with the Forge Warden greeting you with a broken &lt;UNRECOGNIZED TOKEN&gt; accusation. The sword's legal fingerprint had gone stale after a balance change and has been regenerated, and the Warden now releases you rather than showing a garbled accusation when it cannot actually confirm an illegal item.</div>"
    impl_notes: "<div><b>Root cause:</b> a stale Forge legal-variant whitelist (forge_legal_inc.nss) — last regenerated 2026-06-11, 12 days before a balance fix (a026a118b6f, ab-enhance-stack-bug) changed the sword's stored properties. The post-fix item no longer matched the whitelist's old fingerprint and was flagged illegal. Regenerated the whitelist and hardened forge_ward_intro.nss so the Warden releases the PC instead of showing the broken accusation when it cannot confirm an illegal item.</div>"
    design_questions:
      - question: "Known residual risk: bin/ab-enhance-audit.py found zero out-of-sync .bic files in the live vault, but that sweep (and the original repair) only touches carried/equipped inventory, not player bank storage. A sword stashed in a bank before the June 23 property fix and withdrawn later would still carry the pre-fix shape, which genuinely deviates from the current blueprint and is not in the whitelist (which covers current, not legacy, fingerprints) &mdash; so it could still trip the contraband check on a technically-true but player-unfair basis. Should bank storage be audited too, or wait for reports to recur? Related: <a href=\"#idea-dedupe-item-tags\">dedupe-item-tags</a>."
        status: open
        answer: null
