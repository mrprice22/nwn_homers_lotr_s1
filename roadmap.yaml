  - id: bestiary-boss-breakdown
    title: "Beastiary breakdown for just the bosses"
    group: bosses
    status: implemented
    type: Enhancement
    player: "-Methonash-"
    date: "2026-07-24"
    commit: d88b69b1822
    notes: "The Bestiary of Middle-earth now has a third browse option, \"Great foes I have yet to fell.\", listing only the tracked bosses your character has still to slay - each with its Challenge Rating and the area it lairs in, hardest first. The book's index page opens with your progress: \"Great foes felled: x of y.\" Fell every one of them and the great forges grant one extra property slot (and +20% to their value cap)."
    impl_notes: "Bestiary browse mode 2. bst_db.nss gains Bst_BossListSql / Bst_BossTotal / Bst_BossSlainSql / Bst_BossSlainCount / Bst_BuildIntro; Bst_BuildPage grows a mode-2 branch that pages the respawndb boss_registry (the Roll of the Fallen set the forge bonus keys off) instead of the bestiary catalogue. The two campaign DBs cannot be joined in one query, so the already-slain registry-side resrefs are spliced into the respawndb query as a literal quoted IN-list (resrefs are filenames, so this is injection-safe); the registry list and total are cached on the module like forge_inc does. Bst_BossSlainCount reuses forge_inc's COUNT(DISTINCT) formula verbatim (clamped to the registry total) so the book's x/y can never disagree with the forge's tier message. Not an #include of forge_inc - that drags in the appraise/colour stack and bst_db is on the OnDeath hot path. New reply node 15 in bst_book.dlg (script bst_open_boss); progress line is token 5029, set by bst_intro, which runs from dmfi_activate before ActionStartConversation and from the [Back to the index] reply, because token substitution happens at display time and an entry's own action script fires too late."
    manual_steps:
      - "UAT: activate the Bestiary of Middle-earth. Index page shows \"Great foes felled: N of 78.\" and a third option \"Great foes I have yet to fell.\""
      - "UAT: open that list - rows read \"<name>  (CR n)  - <lair area>\", sorted by CR descending, and none of them is a boss the character has already killed."
      - "UAT: page forward/back through the boss list, then [Back to the index] - the progress line is recomputed, and the two creature lists still page correctly."
      - "UAT: kill a tracked boss, reopen the book - the felled count rises by one and that boss is gone from the list."
  - id: wiki-charts-by-week
    title: "wiki charts update for days vs weeks"
    group: wiki-tools
    status: implemented
    hidden: true
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-24"
    commit: 0a93ed3
    notes: "<div>Update the player activity charts refresh process in nwn_manager/bin/nwn-wiki.</div><div>For the two charts:</div><ul><li>Daily play-hours</li><li>Concurrent players</li></ul><div>If there are 35 or less days in the chart data, then keep as is.</div><div>If there are 36 or more days, then only show the most recent 35 days for both the charts, </div><div>and then under each chart, show a weekly version of the chart data going back for all the data (including the first 35 days)</div>"
    impl_notes: "nwn_manager commit 0a93ed3 (`bin/nwn-wiki`, `render_activity_page`). Added `DAILY_WINDOW = 35` plus a `_weekly()` helper that buckets a per-day series into Monday-anchored weeks with a caller-supplied combiner. The daily play-hours and peak-concurrent charts are sliced to `[-35:]`; when the post-cutoff range exceeds 35 days an extra weekly chart is emitted directly beneath each one (sum of hours / max of daily peaks) covering the full range. This replaced the blanket `date_range[-60:]` truncation, which discarded older data before either chart was built, so the weekly roll-ups genuinely reach back to the start. The existing per-chart data cutoffs (2026-05-17 daily, 2026-06-01 concurrency) still apply to both views. Verified against synthetic 20/35/36/90-day datasets: no weekly chart at &lt;=35 days; 35 daily bars plus a full-range weekly chart at 36+."
    manual_steps:
      - step: "After the next scheduled wiki refresh, open the Activity page and confirm both daily charts show 35 bars with a weekly roll-up chart directly beneath each."
        status: open
  - id: numenor-chests
    title: "Fix the 3 chests in Númenor: Noirinan"
    group: quests-areas
    status: implemented
    type: Defect
    player: Szescian82
    date: "2026-07-23"
    commit: 6eccb73f46e
    notes: "<div>The three Setti coffers in <b>Númenor: Noirinan</b> work again. They were locked at an impossible DC with keys that did not exist, and even if forced open they produced nothing. Now a character with high Open Lock can pick each coffer (DC 117), and the three keys — <b>Setti Belt / Ring / Shield Key</b> — can be pickpocketed from (or looted off) <b>Summanus</b> in the same area. Each coffer yields a random <b>end-game belt, ring, or shield</b> suited to the level-40 characters who reach Noirinan. A coffer refills at most once per hour; while spent it sits unlocked and empty, so you never waste a lockpick or a key opening an empty box.</div>"
    impl_notes: "<div><b>Summary.</b> Created the 3 missing Setti keys (pickpocketable/lootable from Summanus), dropped the chest locks from an impossible DC 250 to a pickable 117, replaced the dead loot pools with curated end-game belt/ring/shield sets, and added a once-per-hour cooldown with an entry-timed re-lock. New check_container_keys smoke gate finds any locked+keyed container whose key has no source.</div><div><b>Four separate bugs.</b> The 3 instances in falseheaven.git.json were OpenLockDC=250 (engine shows “success not possible”) keyed to SettiBeltKey/RingKey/ShieldKey — items that <b>did not exist</b> and that no script minted. Their OnOpen loot (chest_settibelt→my_createbelt, etc.) drew from resrefs be_all_*/ri_all_*/sh_all_* that <b>also do not exist</b>, and was gated to HitDice≤12 with empty upper bands — dead for the level-40 visitors who reach the area. And the wrappers minted on <i>every</i> open with OnClosed=sc_setlocked re-locking each close, an infinite end-game farm once opening was fixed.</div><div><b>Fix.</b> (1) Created settibeltkey/settiringkey/settishieldkey.uti (Tag = KeyName, filed by PaletteID) and added them to the summanus.utc ItemList with Dropable=1+Pickpocketable=1 (encounter sommanus spawns from the blueprint, covering steal-while-alive and drop-on-death). (2) Lock DCs 250→117, kept KeyRequired=0+AutoRemoveKey=1. (3) Rewrote my_createbelt/ring/shield.nss to curated 6-item end-game pools (cap raised to 60, empty-resref guarded), vetted against module-index/inaccessible_items.json — boss-dropped items plus 5 source-less orphans the chests now home (epicbelt, beltofpower002, epicshield, shieldofithilien, it_mring042); excluded god/joke items and lore-locked uniques (One Ring, Arwen's ring). (4) New setti_loot_inc.nss: real-epoch (SQLite strftime) once-per-hour gate in the wrappers; removed the OnClosed re-lock; SettiRearm() re-locks a cooled+empty coffer, called from q_frk_enter (falseheaven-only OnEnter) so re-arm is timed to a returning player's entry. New build gate tests/check_container_keys.py flags any locked+keyed container whose key has neither a .uti blueprint nor a minting script (script-aware, with a KNOWN baseline for the two other pre-existing offenders).</div>"
    manual_steps:
      - step: "UAT: with a high Open-Lock PC, pick each of the 3 Setti coffers at DC 117 and confirm a level-appropriate belt / ring / shield appears; repeat across opens to confirm pool variety."
        status: open
      - step: "UAT: pickpocket Setti Belt/Ring/Shield Key off Summanus, and separately kill Summanus, confirming the keys are both stealable and drop on death; open a coffer with its key and confirm the key is consumed (AutoRemoveKey)."
        status: open
      - step: "UAT cooldown: loot a coffer, take the item, close it; re-open within the hour and confirm it is EMPTY and stays UNLOCKED (no wasted key/pick). Leave and re-enter the area after the hour and confirm the coffer is RE-LOCKED and mints fresh loot."
        status: open
      - step: "Req-3 follow-up (tracked in the check_container_keys KNOWN baseline, NOT shipped here): DiviningPool (diviningpl.utp) is KeyRequired with missing key 'divinekey' and no OnOpen loot &mdash; decide create key+source vs drop KeyRequired. loogazlair Chest1/Chest2 reference missing 'loogazkey' but are pickable at DC 18 &mdash; clear the phantom KeyName when convenient."
        status: open
  - id: petrification-timeout-2
    title: "Petrification timeout not working as expected"
    group: combat-classes
    status: implemented
    type: Defect
    player: Szescian82
    date: "2026-07-23"
    commit: 45167215955
    notes: "<div>The <a href=\"#idea-petrification-timeout\">2-minute petrification timeout</a> now actually fires. If any enemy turns you to stone, escalating warnings appear <b>both in your chat log and as floating text above your character</b> every 15 seconds, and after 2 minutes you die and get the normal respawn option instead of being stuck as a statue. Being cured (Stone to Flesh) mid-countdown cancels it, as expected.</div>"
    impl_notes: "<div><b>Root cause:</b> the original fix (commit 46aa7efaa1e) added a bounded-timeout chain inside DoPetrification() in the module's x0_i0_spells.nss include. But in-game petrification comes from <b>base-game precompiled gaze / flesh-to-stone scripts</b> whose .ncs already inline the <i>stock</i> DoPetrification — no module script recompiles that include on the petrify path. So the edited include was dead code and the stock behavior (indefinite petrify / no-op death GUI) still ran. Secondary flaw: the timeout DelayCommand chain was queued on OBJECT_SELF (the petrifying NPC), so it was cancelled if that NPC died mid-window.</div><div><b>Fix:</b> replaced it with a source-independent watcher in the module heartbeat bleeding.nss (petrifyCheck(), called from the existing GetFirstPC()/GetNextPC() loop). Per PC it scans for EFFECT_TYPE_PETRIFY (same idiom as mw_hench_hb.nss::MW_HasPetrify), counts heartbeats (PETRIFY_HB, ~6s each), emits the seven original escalating messages once per 15s bucket via <b>both</b> SendMessageToPC and FloatingTextStringOnCreature(..., FALSE), and at 120s applies EffectDeath — routing through ondeath020 to the respawn GUI (same pipeline the bleed-out path already uses). Trackers cleared when the effect is gone, so a cure stops it. Removed the now-dead LOTR_PetrifyTimeoutTick + DelayCommand edits from x0_i0_spells.nss (restored the stock PopUpDeathGUIPanel line) so there is a single source of truth.</div>"
    manual_steps:
      - step: "UAT: get a low-level PC petrified by a basilisk/medusa (basilisk00x spawn); confirm escalating warnings appear both in the chat log AND as floating text above the character roughly every 15s."
        status: open
      - step: "UAT: confirm that at ~2 minutes the petrified PC dies and the respawn GUI panel appears (not a stuck statue)."
        status: open
      - step: "UAT: kill the petrifying creature BEFORE the 2 minutes elapse and confirm the timeout still fires (proves the OBJECT_SELF-cancellation bug is gone)."
        status: open
      - step: "UAT: have a MeaningWave guide (or any Stone-to-Flesh) cure the PC mid-countdown and confirm the watcher stops (no spurious death after cure)."
        status: open
  - id: mw-questgiver-ignore-combat
    title: "Meaningwave quest givers to ignore and be ignored in combat"
    group: combat-classes
    status: implemented
    type: Defect
    player: "HomelessSon (Server Admin)"
    date: "2026-07-23"
    commit: bfa48e426304a70c239e7481d89eb24c7765b6b4
    notes: "<div>The wandering <b>MeaningWave quiz-givers</b> (Peterson, Campbell, Jung, Aurelius, Akira, Jocko, McKenna, Watts) are now fully peaceful. They never fight, and no creature — not even hostile monsters roaming their areas — will target or attack them, so you can take their quizzes undisturbed even in the middle of a fight.</div>"
    impl_notes: "<div><b>Summary.</b> Made the 8 wandering MeaningWave quiz-givers fully non-combatant: a shared OnSpawn script sets them immortal/plot and applies a permanent supernatural Sanctuary(100) so nothing ever targets them, and their combat event scripts are repointed to a no-op so they never retaliate. The caster-duel companion variants are untouched.</div><div><b>Root cause:</b> the 8 spawned quiz-giver blueprints (mw_*_w + mw_akira) used the stock x2_def_* combat scripts, so they retaliated when hit, and being on the Merchant faction (FactionID 3) they were still valid enemy targets for the Hostile faction. Plot/Immortal only prevented death, not targeting or fighting.</div><div><b>Fix:</b> new mw_qg_spawn.nss (OnSpawn) runs ExecuteScript(\"x2_def_spawn\") to preserve ambient/walk behaviour, then SetImmortal+SetPlotFlag, then applies a permanent supernatural EffectSanctuary(100) — an unbeatable DC so nothing selects them as a target regardless of faction, and it never breaks since they take no hostile action. New mw_qg_noop.nss (empty) is wired to ScriptAttacked, ScriptDamaged, ScriptEndRound, ScriptOnNotice, ScriptSpellAt so they never retaliate or initiate. Edited the 8 blueprints to repoint those 5 combat events + ScriptSpawn and reassert Plot=1/IsImmortal=1. The non-_w caster-duel variants (mw_peterson etc., which use mw_def_attacked/MW_Style counterspell) were deliberately left combat-capable. All builtins verified against the game nwscript.nss; gates passed (script compilation, dialog-integrity, boss registry, palette coverage, reward-exploit, MeaningWave quiz banks, 10/10 smoke).</div>"
    manual_steps:
      - step: "UAT: pull a hostile creature adjacent to a spawned MeaningWave quiz-giver (e.g. Watts in Old Forest (oldforest001), or Jung in Crypts of the Lost (cryptsofthelosts)) and confirm the hostile ignores the NPC entirely and the NPC never fights back."
        status: open
      - step: "UAT: confirm the quiz-givers still wander/idle normally and their quiz conversation still opens when clicked."
        status: open
