  - id: toggle-reboot-on-empty
    title: "[Anvil] Adhoc toggle reboot on empty with warning to players"
    group: wiki-tools
    status: awarded
    type: Enhancement
    player: "HomelessSon (Server Admin)"
    date: "2026-07-02"
    commit: 9eb2c2b0067, 3b0f1df7278, 64eab5d8c8d, 3ee0a44a3da, 4c2fc0c4529
    notes: "As a Server Admin, <br><div>I want to be able to push module updates that require a reboot without interrupting players or logging in to ask them to log out. </div><div><ul><li>Use Anvil plugin to trigger an in-game alert that server will reboot when next empty (also update on-login message to newly joining players of the same until reboot happens). </li><li>Support custom message to players explaining what updates to expect/look forward to when server next reboots. </li></ul></div><div><br></div><div><b>Implemented 2026-07-02:</b> The Anvil ServerRestartManager now honours a reboot-on-empty control file. Arm it from the shell with bin/reboot-on-empty \"your message\" (add --nwsync to also rebuild the client download manifest) after deploying an update — no in-game login needed. While armed, online players get a broadcast + shout warning and newly joining players see an on-login notice carrying the custom message. Once the server sits empty for ~45s it saves all characters, shuts down cleanly, and a host systemd .path unit restarts just the server service onto the freshly deployed module (rebuilding NWSync first when requested). The arm flag is deleted before shutdown so it can never boot-loop, and bin/reboot-on-empty off cancels a pending reboot. Docs in rebootSchedule.md.</div>"
