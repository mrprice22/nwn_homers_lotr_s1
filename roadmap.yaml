    date: "2026-07-23"
    commit: 08f763c57201c62fd5c698041905ae6ee2659875
    notes: "<div>The Well of Souls quest was unfinishable — the Gondor Scribe you were sent to find had never actually been placed in the world. She now stands in the Tower of the High Wizard, and the whole arc works end to end: Hanee the Loon in Bree sends you north to kill Azagoth in the Ruins of Annúminas, pays you 5,000 XP for the news, and hands you on to the Gondor wizards, where the scribe pays 10,000 XP (up from 4,000) for Azagoth's head. You can also walk in cold and start from the scribe. Details: <a href=\"QuestGuide.html#well-of-souls\">Quest Guide → Well of Souls</a>.</div>"
    impl_notes: "<div><b>Root cause:</b> the quest-giver NPC was designed but never created or placed. The gondorscribe conversation, journal category, condition/action scripts and the boss all existed, but no creature in the module carried the gondorscribe conversation, and ruinsofannuminas.git.json had zero static creatures. A 2026-05-28 pass only fixed a DLG Quest field name and missed the absent NPC.</div><div><br></div><div><b>Built:</b> new gondorscribe.utc.json (base comfemale002, Tag GondorScribe, Conversation gondorscribe, FactionID 6, Plot=1 so the quest-giver cannot be killed), placed in area011 near the wizards via bin/place-helper.py (clearance verified, __struct_id 4 hardcoded). New sc_hanee_head.nss (StartingConditional: has azagothshead and not hanee_head_reward) + at_hanee_head.nss (RewardPartyXP 5000, set flag, journal entry 2, keeps the head), wired into Hanee's conversation. Ruin of Annuminas journal entry 2 added (End 1). at_008.nss scribe reward bumped 4000 -&gt; 10000, head consumed. Cold-start path at the scribe unchanged (accept -&gt; journal + Annuminas Key). Full draft in QUEST_FIX_well_of_souls_plan.md.</div><div><br></div><div><b>2026-07-23 (commit 08f763c57):</b> implemented the answered design-question follow-up. In ruinsofannuminas.git the two Chest1/KeyName=AnnuminasKey placeables at Placeable-List idx 7 (X71.23/Y50.06) and idx 8 (X76.24/Y49.98) are now KeyRequired=1+AutoRemoveKey=1, unpickable, with unique LocName/Description (Sorcerer's Warded Coffer / Wizard's Sealed Reliquary) and static caster-gear ItemLists; their OnOpen/OnClosed (chest_respawner/chest_relock) were cleared so the static loot survives and the chest stays open once the key is spent. idx 9/10 left pickable + GenerateMediumTreasure (no static loot existed to redistribute, so the caster gear is pure net-gain). 6 new .uti blueprints (sorc_robe_annu/sorc_amul_annu/sorc_ring_annu = CHA + Sorcerer bonus spell slots L6-9 + resists; wiz_robe_annu/wiz_amul_annu/wiz_ring_annu = INT + Wizard bonus spell slots L6-9 + resists) cloned from epicmagerobe/amuletofadaption/aegisoftorment and filed by PaletteID. Scribe key-give node (gondorscribe.dlg, script at_007) gained a non-branching in-character warning that the key opens only one warded chest; at_007 gained an anti-stockpile guard (annu_key_given PC local int, no second key while one is held). All 10 smoke gates passed (palette-coverage, reward-exploit, locked-container-keys). <b>Open:</b> residual relog key-farm vector — see design question below.</div>"
    design_questions:
      - question: "On the Hanee-first route the Annuminas Key still only comes from the scribe, so the ruins' four key chests (KeyRequired=0, pickable) are reached before the key exists. Leave as-is, grant the key at Hanee's handoff, or set KeyRequired=1?"
        status: answered
        answer: "Leave as is with key coming from scribe; set 2 of the chests to be keyRequired and unpickable -- add moderately high powered sorcerer gear in one and wizard gear in the other, a 3 pieces of +10 gear with some resistances, bonus spell slots, and relevant ability score boosts. The key should be destroyed on use, so player can only open 1 of the 2 locked chests. The scribe should offer an in game warning/explanation for why (something, something, magic) and the chests should be labeled with unique names and have unique descriptions that hint at what they are rewards for (sorcerer vs wizard). Move the original contents of the 2 chests we're locking with a key here to be split up among the other 2 chests that remain pickable so no net-loss of loot, only added loot for people who do the quest and come back with the key."
        question_h: 64
        answer_h: 64
      - question: "Residual relog key-farm on the new warded chests: the scribe accept node (StartingList entry 0) still fires whenever the PC lacks azagothshead and azagothdead!=1, so a player could open one warded chest, relog (which clears the session annu_key_given local int), re-accept for a fresh key, and open the second warded chest too. AutoRemoveKey + the same-session guard block casual double-dipping but not deliberate relog-farming. Proposed: leave as-is (low-value gear, high-effort setup), OR harden it — persist the guard as a roadmapdb/campaign-DB row keyed by CD-key/UUID, or advance the quest stage so accept-entry-0 stops firing after the first key grant. Which do you want?"
        status: open
        answer: null
    manual_steps:
      - step: "UAT Hanee-first path: accept from Hanee in Bree -> kill Azagoth in the Ruins of Annuminas -> back to Hanee (+5k XP, keeps head, no repeat on re-talk) -> Gondor Scribe in the Tower ground floor (+10k XP, head consumed, Well of Souls stage 2)."
        status: open
        step_h: 64
      - step: "UAT cold-start path: a fresh character talks to the scribe -> accept grants journal + Annuminas Key; a later head turn-in pays 10k."
        status: open
        step_h: 64
      - step: "UAT regression: Hanee's plain greeting is unchanged without the head, and the scribe is unkillable."
        status: open
        step_h: 64
      - step: "UAT appearance: spawn/loot the 6 new caster items (sorc_robe_annu, sorc_amul_annu, sorc_ring_annu, wiz_robe_annu, wiz_amul_annu, wiz_ring_annu) and confirm each looks right, equips on a caster, and its properties display (ability score, bonus spell slots, resistances). Palette: robes -> Armor > Clothing; amulets -> Miscellaneous > Jewelry > Amulets; rings -> Miscellaneous > Jewelry > Rings."
        status: open
      - step: "UAT one-key-one-chest: in Ruins of Annuminas (ruinsofannuminas), get the Annuminas Key from the Gondor Scribe (Tower of the High Wizard: Ground Floor / area011), open ONE warded chest (Sorcerer's Warded Coffer @ X71.23/Y50.06 or Wizard's Sealed Reliquary @ X76.24/Y49.98), and confirm the key is consumed and the OTHER warded chest can no longer be opened (unpickable + no key)."
        status: open
      - step: "UAT pickable chests: confirm the two remaining Annuminas chests (Placeable-List idx 9 @ X62.34/Y54.80 and idx 10 @ X62.09/Y44.90) are still lockpickable and still generate medium treasure on open."
        status: open
